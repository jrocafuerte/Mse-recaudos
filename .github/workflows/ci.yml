# Pipeline DevSecOps: calidad → SAST → SCA/secretos → contenedor. Bloquea el merge si algo falla.
# Recomendado: fijar cada action por SHA completo (supply chain) y dejar que Dependabot lo actualice.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Tests unitarios + cobertura
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
      - name: Tests e2e (contrato HTTP + controles de seguridad)
        run: npm run test:e2e
        env: { NODE_ENV: test }
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info, retention-days: 7 }

  sonar:
    name: SonarQube (quality gate)
    needs: quality
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: coverage, path: coverage }
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    container: { image: semgrep/semgrep }
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --error --metrics=off
          --config p/owasp-top-ten --config p/nodejs --config p/typescript
          --config p/jwt --config p/secrets --config .semgrep/rules.yml
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif, category: semgrep }

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write, actions: read }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  secrets:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  sca:
    name: SCA (dependencias + SBOM)
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: npm audit (producción, falla en HIGH/CRITICAL)
        run: npm audit --omit=dev --audit-level=high
      - name: SBOM CycloneDX
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file sbom.cdx.json
      - name: Trivy (vulnerabilidades, secretos, misconfig del repo)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-fs.sarif, category: trivy-fs }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }

  container:
    name: Contenedor (Hadolint + Trivy image)
    needs: quality
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - run: docker build -t ${{ github.event.repository.name }}:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ github.event.repository.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-image.sarif, category: trivy-image }
